<div [id]="alertId()" class="flex items-start justify-between gap-3 rounded-control border bg-surface-elevated p-3 text-sm text-text-primary" [class.border-error]="variant() === 'error'" [class.border-info]="variant() === 'info'" [class.border-success]="variant() === 'success'" [class.border-warning]="variant() === 'warning'" role="alert"><span>{{ message() }}</span><button [id]="alertId() + '-close-button'" type="button" class="rounded-control px-2 py-1 text-text-secondary transition hover:bg-secondary hover:text-text-primary" aria-label="Dismiss alert" (click)="dismissed.emit()">Dismiss</button></div>
