<footer [id]="containerId()" class="mt-3 flex items-center justify-between"><button [id]="previousId()" type="button" class="rounded-control border border-border px-3 py-2 text-text-primary disabled:cursor-not-allowed disabled:bg-disabled-background" [disabled]="page() === 1" (click)="previous.emit()">Previous</button><select [id]="pageSizeId()" class="rounded-control border border-border bg-surface p-2 text-text-primary" [value]="pageSize()" (change)="pageSizeChanged.emit(+$any($event.target).value)"><option value="10">10</option><option value="25">25</option></select><button [id]="nextId()" type="button" class="rounded-control border border-border px-3 py-2 text-text-primary disabled:cursor-not-allowed disabled:bg-disabled-background" [disabled]="itemCount() < pageSize()" (click)="next.emit()">Next</button></footer>
