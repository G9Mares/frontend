server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser calls /api/... on the same public origin. Nginx removes the
    # /api/ prefix and forwards the request through Docker's private network.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Angular routes are resolved by the client application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
